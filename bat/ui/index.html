<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAT</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e8ee;
    --muted: #8b93a7; --accent: #6ea8fe; --user: #1f2937; --tool: #1a2a1f;
    --err: #e5484d; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 14px;
           border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .08em; }
  header input { flex: 1; min-width: 220px; background: var(--bg); color: var(--text);
                 border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
                 font-family: var(--mono); font-size: 13px; }
  button { background: var(--accent); color: #0b1020; border: 0; border-radius: 6px;
           padding: 7px 12px; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { flex: 1; overflow-y: auto; padding: 18px 14px; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .user { background: var(--user); align-self: flex-end; max-width: 85%; }
  .assistant { background: var(--panel); border: 1px solid var(--line); }
  .tool { background: var(--tool); border: 1px dashed #2f4a38; font-family: var(--mono);
          font-size: 12.5px; color: #b7d4c0; }
  .tool b { color: #7fd49a; }
  .error { border-color: var(--err); color: #ffb4b6; }
  .meta { color: var(--muted); font-size: 12px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 14px; }
  footer form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  footer textarea { flex: 1; resize: none; background: var(--bg); color: var(--text);
                    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
                    font: inherit; min-height: 44px; max-height: 160px; }
  .cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <h1>BAT</h1>
  <input id="key" type="password" placeholder="API key (bat_sk_…)" autocomplete="off">
  <button id="connect">Connect</button>
  <button id="newSession" class="ghost" disabled>New session</button>
  <span id="status">not connected</span>
</header>

<main><div class="wrap" id="log"></div></main>

<footer>
  <form id="composer">
    <textarea id="input" placeholder="Ask BAT… (Enter to send, Shift+Enter for newline)" disabled></textarea>
    <button id="send" disabled>Send</button>
  </form>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), status = $("status"), input = $("input"), sendBtn = $("send");
let key = localStorage.getItem("bat.key") || "";
let session = localStorage.getItem("bat.session") || "";
$("key").value = key;

const headers = () => ({ "Authorization": "Bearer " + key, "Content-Type": "application/json" });

function add(cls, text, html) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  if (html) el.innerHTML = html; else el.textContent = text;
  log.appendChild(el);
  el.scrollIntoView({ block: "end" });
  return el;
}

function setReady(ok, note) {
  status.textContent = note;
  input.disabled = sendBtn.disabled = $("newSession").disabled = !ok;
  if (ok) input.focus();
}

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: headers(), body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch {}
    throw new Error(`${r.status} ${detail}`);
  }
  return r.status === 204 ? null : r.json();
}

async function connect() {
  key = $("key").value.trim();
  if (!key) return setReady(false, "enter an API key");
  localStorage.setItem("bat.key", key);
  try {
    const me = await api("GET", "/v1/whoami");
    if (session) {
      try { await api("GET", `/v1/sessions/${session}`); }
      catch { session = ""; }
    }
    if (!session) await newSession();
    else await loadHistory();
    setReady(true, `${me.tenant_id} / ${me.principal_id}`);
  } catch (e) { setReady(false, e.message); }
}

async function newSession() {
  const s = await api("POST", "/v1/sessions", { title: "web ui" });
  session = s.id; localStorage.setItem("bat.session", session);
  log.innerHTML = "";
  add("meta", `session ${session}`);
}

async function loadHistory() {
  log.innerHTML = "";
  add("meta", `session ${session}`);
  const h = await api("GET", `/v1/sessions/${session}/messages?limit=50`);
  for (const m of h.items) add(m.role === "user" ? "user" : "assistant", m.content);
}

// Reads an SSE body from fetch (EventSource can't POST or send headers).
async function* sse(response) {
  const reader = response.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const frame = buf.slice(0, i); buf = buf.slice(i + 2);
      let event = "message", data = "";
      for (const line of frame.split("\n")) {
        if (line.startsWith("event: ")) event = line.slice(7);
        else if (line.startsWith("data: ")) data += line.slice(6);
      }
      if (data) yield { event, data: JSON.parse(data) };
    }
  }
}

async function send(text) {
  add("user", text);
  const out = add("assistant cursor", "");
  setReady(false, "thinking…");
  try {
    const r = await fetch(`/v1/sessions/${session}/messages/stream`, {
      method: "POST", headers: headers(), body: JSON.stringify({ content: text }),
    });
    if (!r.ok) throw new Error(`${r.status} ${(await r.json()).detail || r.statusText}`);
    let toolEl = null;
    for await (const { event, data } of sse(r)) {
      if (event === "token") { out.textContent += data.text; out.scrollIntoView({ block: "end" }); }
      else if (event === "tool_call") {
        toolEl = add("tool", "", `<b>→ ${data.name}</b>(${escapeHtml(JSON.stringify(data.arguments))})`);
        log.appendChild(out);
      }
      else if (event === "tool_result" && toolEl) {
        toolEl.innerHTML += `<br>← ${escapeHtml(data.content.slice(0, 600))}`;
      }
      else if (event === "final") { if (!out.textContent) out.textContent = data.content; }
      else if (event === "error") { out.classList.add("error"); out.textContent = `${data.code}: ${data.message}`; }
    }
  } catch (e) {
    out.classList.add("error"); out.textContent = e.message;
  } finally {
    out.classList.remove("cursor");
    setReady(true, status.textContent.startsWith("thinking") ? "ready" : status.textContent);
  }
}

const escapeHtml = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

$("connect").onclick = connect;
$("newSession").onclick = () => newSession().catch((e) => add("assistant error", e.message));
$("composer").onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  send(text);
};
input.onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
};
if (key) connect();
</script>
</body>
</html>
