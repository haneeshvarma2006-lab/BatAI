[project]
name = "bat-platform"
version = "0.1.0"
description = "Multi-tenant agentic AI platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
# Native in-process inference. No prebuilt wheel exists for every interpreter --
# on Python 3.14 it only resolves as an sdist and needs cmake + a C++ toolchain.
# Python 3.12 has prebuilt wheels, which is the supported path.
model = ["llama-cpp-python>=0.3.0"]
rag = ["chromadb>=1.0", "pypdf>=5.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "mypy>=1.11", "ruff>=0.6"]
all = ["bat-platform[model,rag]"]

[project.scripts]
bat = "bat.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bat*"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
